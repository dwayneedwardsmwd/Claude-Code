<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0"/>
      <stop offset="25%" style="stop-color:#a0a0a0"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="75%" style="stop-color:#808080"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
    <linearGradient id="drillBit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#707070"/>
      <stop offset="30%" style="stop-color:#a0a0a0"/>
      <stop offset="50%" style="stop-color:#c8c8c8"/>
      <stop offset="70%" style="stop-color:#a0a0a0"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
    <linearGradient id="groove" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#404040"/>
      <stop offset="50%" style="stop-color:#606060"/>
      <stop offset="100%" style="stop-color:#303030"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#000000"/>

  <!-- Drill bit body - main cylinder tapering to point -->
  <path d="M200,80 L312,80 Q330,80 330,100 L330,280 Q310,380 256,450 Q202,380 182,280 L182,100 Q182,80 200,80 Z" fill="url(#drillBit)"/>

  <!-- Spiral groove 1 -->
  <path d="M190,100 Q230,140 310,120 Q280,180 320,200 Q270,260 300,300 Q250,360 256,420"
        stroke="url(#groove)" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Spiral groove 2 -->
  <path d="M320,100 Q280,140 200,120 Q230,180 190,200 Q240,260 210,300 Q260,360 256,420"
        stroke="url(#groove)" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Highlight lines -->
  <path d="M256,90 L256,400" stroke="rgba(255,255,255,0.15)" stroke-width="30" stroke-linecap="round"/>

  <!-- Top collar -->
  <rect x="175" y="70" width="162" height="25" rx="5" fill="url(#metallic)"/>
  <rect x="175" y="70" width="162" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>

</svg>
