<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Drill pipe representation -->
  <g fill="#ed8936">
    <!-- Vertical pipe -->
    <rect x="220" y="80" width="72" height="280" rx="8"/>
    <!-- Pipe threads (simplified) -->
    <rect x="210" y="100" width="92" height="12" rx="4"/>
    <rect x="210" y="140" width="92" height="12" rx="4"/>
    <rect x="210" y="180" width="92" height="12" rx="4"/>
  </g>

  <!-- Bit representation -->
  <g fill="#f6ad55">
    <polygon points="256,360 200,430 312,430"/>
    <circle cx="230" cy="400" r="10" fill="#1a365d"/>
    <circle cx="256" cy="410" r="10" fill="#1a365d"/>
    <circle cx="282" cy="400" r="10" fill="#1a365d"/>
  </g>

  <!-- MWD text -->
  <text x="256" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">MWD</text>
</svg>
